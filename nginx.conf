server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (keep in sync with public/server.cjs).
    # Repeated in the assets location because nginx drops inherited add_header
    # directives when a location defines its own.
    set $csp "default-src 'self'; img-src 'self' data: blob: https://*.blob.core.windows.net; media-src 'self' blob: https://*.blob.core.windows.net; frame-src 'self' https://*.blob.core.windows.net https://login.microsoftonline.com; connect-src 'self' https://login.microsoftonline.com https://*.blob.core.windows.net; object-src 'none'; base-uri 'self'; frame-ancestors 'self'";

    add_header Content-Security-Policy $csp always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|svg|ico|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy $csp always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
    }
}
